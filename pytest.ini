[pytest]
asyncio_mode = auto
filterwarnings =
    # `create_react_agent` se movió a `langchain.agents` en LangGraph 1.0,
    # pero sigue funcionando igual hasta la 2.0: se silencia el aviso para
    # que la salida de los tests quede legible.
    ignore:create_react_agent has been moved:DeprecationWarning
    ignore::langgraph.warnings.LangGraphDeprecatedSinceV10
